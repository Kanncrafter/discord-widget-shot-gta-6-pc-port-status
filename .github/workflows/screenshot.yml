name: Post Widget Screenshot to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: "https://portwatch-vi.xyz"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
          
      - name: Capture dark mode widget with progress bar and send to Discord
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              colorScheme: "dark"
            });

            await page.emulateMedia({ colorScheme: "dark" });
            await page.goto(process.env.TARGET_URL, { waitUntil: "networkidle", timeout: 60000 });

            const el = page.locator("section.overall-wrap").first();
            await el.waitFor({ state: "visible", timeout: 30000 });

            // Ins Sichtfeld scrollen und Scroll-Events auslösen, falls der Balken beim Scrollen animiert wird
            await el.scrollIntoViewIfNeeded();
            await page.mouse.wheel(0, 200);
            await page.mouse.wheel(0, -200);
            await page.waitForTimeout(5000);

            const buf = await el.screenshot({ animations: "allow" });
            await browser.close();

            const form = new FormData();
            form.append("payload_json", JSON.stringify({
              content: "Aktueller Stand (Darkmode)"
            }));
            form.append("file", new Blob([buf], { type: "image/png" }), "widget.png");

            const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              body: form
            });
            if (!res.ok) {
              throw new Error("Discord webhook failed: " + res.status + " " + await res.text());
            }
          })();
          '
