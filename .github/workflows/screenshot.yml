name: Post Widget Screenshot to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: "https://portwatch-vi.xyz"
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: "DEINE_KANAL_ID_HIER"
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Capture dark mode widget, post new message and delete previous bot message
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              colorScheme: "dark"
            });

            await page.emulateMedia({ colorScheme: "dark" });
            await page.goto(process.env.TARGET_URL, { waitUntil: "networkidle", timeout: 60000 });

            const el = page.locator("section.overall-wrap").first();
            await el.waitFor({ state: "visible", timeout: 30000 });

            await el.scrollIntoViewIfNeeded();
            await page.mouse.wheel(0, 200);
            await page.mouse.wheel(0, -200);
            await page.waitForTimeout(5000);

            const buf = await el.screenshot({ animations: "allow" });
            await browser.close();

            const headers = {
              Authorization: `Bot ${process.env.DISCORD_BOT_TOKEN}`
            };
            const baseUrl = `https://discord.com/api/v10/channels/${process.env.DISCORD_CHANNEL_ID}/messages`;

            // 1. Neue Nachricht mit Bild posten
            const form = new FormData();
            form.append("payload_json", JSON.stringify({
              content: "Aktueller Stand (Darkmode)"
            }));
            form.append("file", new Blob([buf], { type: "image/png" }), "widget.png");

            const postRes = await fetch(baseUrl, {
              method: "POST",
              headers,
              body: form
            });
            if (!postRes.ok) {
              throw new Error("Discord post failed: " + postRes.status + " " + await postRes.text());
            }
            const createdMsg = await postRes.json();

            // 2. Eigene Bot-User-ID ermitteln
            const meRes = await fetch("https://discord.com/api/v10/users/@me", { headers });
            if (!meRes.ok) {
              throw new Error("Fetching bot user failed: " + meRes.status + " " + await meRes.text());
            }
            const me = await meRes.json();

            // 3. Letzte Nachrichten laden und vorherige eigene Bot-Nachrichten löschen
            const listRes = await fetch(`${baseUrl}?limit=15`, { headers });
            if (!listRes.ok) {
              throw new Error("Listing messages failed: " + listRes.status + " " + await listRes.text());
            }
            const messages = await listRes.json();

            for (const msg of messages) {
              if (msg.author && msg.author.id === me.id && msg.id !== createdMsg.id) {
                const delRes = await fetch(`${baseUrl}/${msg.id}`, {
                  method: "DELETE",
                  headers
                });
                if (!delRes.ok && delRes.status !== 404) {
                  console.warn("Could not delete message", msg.id, delRes.status);
                }
              }
            }
          })();
          '
